 brick:svg('<g fill="url(#gk)"><rect x="2" y="4" width="9" height="4.5" rx="1"/><rect x="12.5" y="4" width="9.5" height="4.5" rx="1"/><rect x="2" y="9.8" width="5" height="4.5" rx="1"/><rect x="8.5" y="9.8" width="7" height="4.5" rx="1"/><rect x="17" y="9.8" width="5" height="4.5" rx="1"/><rect x="2" y="15.6" width="9" height="4.5" rx="1"/><rect x="12.5" y="15.6" width="9.5" height="4.5" rx="1"/></g>',grad('gk','#ffb27a','#d9552a')),

 ar:svg('<text x="12" y="19" font-size="22" text-anchor="middle" fill="url(#gar)" font-weight="700">ع</text>',grad('gar','#6ff0d4','#1aa6c9')),
 tag:svg('<rect x="2.5" y="5" width="19" height="14" rx="3.5" fill="url(#gt)"/><circle cx="9" cy="11" r="2.3" fill="#0b0d2c"/><path d="M5.2 16.4c.7-2.4 6.1-2.4 7.6 0z" fill="#0b0d2c"/><rect x="14" y="9.6" width="5" height="1.6" rx=".8" fill="#0b0d2c"/><rect x="14" y="13" width="3.5" height="1.6" rx=".8" fill="#0b0d2c"/>',grad('gt','#8ad0ff','#6a62f2')),
 gun:svg('<path d="M2 8h15.5l2.5 2.2V13h-7l-1.2 5H8L9 13H2z" fill="url(#gu)"/>',grad('gu','#b9c3d8','#5f6c88'))
};
const SI={all:['img','all'],fonts:['img','alphabet'],arabic:['svg','ar'],names:['svg','tag'],freefireArray:['svg','fire'],emoticonArray:['svg','smile'],gameArray:['img','crazy'],attitudeArray:['img','attitude'],angryArray:['svg','bolt'],heartArray:['img','cute2'],cuteArray:['img','cute'],boyArray:['img','small'],girlArray:['img','fantasy'],gymArray:['svg','gym'],sadArray:['svg','sad'],bricksArray:['svg','brick'],hindiArray:['svg','om'],gunArray:['svg','gun']};
const siHtml=id=>{const s=SI[id]||['img','all'];return s[0]==='img'?`<img src="ic/side_${s[1]}.png">`:SIC[s[1]]};
const CATS=[{id:'all',name:'All'},{id:'fonts',name:'Fonts'},{id:'arabic',name:'Arabic'},{id:'names',name:'Names'},...STYLES.map(s=>({id:s.id,name:s.name}))];
const CHIPS=[{id:'all',l:'All',c:'c1'},{id:'deco',l:'Fantasy',c:'c2'},{id:'fonts',l:'Alphabet',c:'c3'}];
const CHIPICON={all:'<svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l3 6.8 7.4.7-5.6 4.9 1.7 7.2L12 17.8 5.5 21.6l1.7-7.2L1.6 9.5 9 8.8z"/></svg>',deco:'<img src="ic/chip_fantasy.png">',fonts:'<img src="ic/chip_abc.png">'};
const COPYSVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2" fill="#fff"/><path d="M16 5V4a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2"/></svg>';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function items(){
  const t=$('q').value||(cat==='arabic'?'محمد حسن':(cfg.sample||'Font Copy Paste'));
  const ar=AR_RE.test(t),inAll=cat==='all',out=[];
  if((inAll||cat==='fonts')&&chip!=='deco')FONTS.forEach(x=>{const r=x.f(t);if(r!==t||cat==='fonts')out.push({cat:x.n,text:r})});
  if(chip!=='fonts'){
    if((inAll&&ar)||cat==='arabic')AR_STYLES.forEach(x=>out.push({cat:x.n,text:x.f(t)}));
    if(inAll||cat==='names')NAME_T.forEach(n=>out.push({cat:n[0],text:nameFmt(n[1],t)}));
    STYLES.forEach(s=>{if(inAll||cat===s.id)s.items.forEach(p=>out.push({cat:s.name,text:p.replace(/\[\[t\]\]/g,t)}))});
  }
  return out;
}
function seg(key,opts,cur){return `<div class="seg">${opts.map(o=>`<span class="${o[0]===cur?'on':''}" onclick="setCfg('${key}',${typeof o[0]==='number'?o[0]:`'${o[0]}'`})">${o[1]}</span>`).join('')}</div>`}
function sw(key){return `<div class="sw ${cfg[key]?'on':''}" onclick="setCfg('${key}',${!cfg[key]})"></div>`}
function settingsHtml(){
  return `<div class="page" dir="rtl"><div class="h1">اعدادات</div>
  <div class="sec">المظهر</div><div class="box">
   <div class="row"><div class="l">السمة</div>${seg('theme',[['dark','داكن'],['light','فاتح'],['auto','تلقائي']],cfg.theme)}</div>
   <div class="row"><div class="l">لون التطبيق</div><div style="display:flex;gap:6px">${ACC.map((c,i)=>`<div class="dot ${i===cfg.acc?'on':''}" style="background:linear-gradient(135deg,${c[1]},${c[3]})" onclick="setCfg('acc',${i})"></div>`).join('')}</div></div>
   <div class="row"><div class="l">حجم النص</div>${seg('fs',[[10,'صغير'],[12,'وسط'],[14.5,'كبير']],cfg.fs)}</div>
  </div>
  <div class="sec">السلوك</div><div class="box">
   <div class="row"><div class="l">اهتزاز عند النسخ<div class="s">اهتزاز خفيف بعد كل نسخ</div></div>${sw('vib')}</div>
   <div class="row"><div class="l">حفظ السجل<div class="s">حفظ آخر ما نسخته في تاب History</div></div>${sw('keep')}</div>
   <div class="row" style="display:block"><div class="l">النص الافتراضي<div class="s">يظهر في الكروت لما خانة الكتابة فاضية</div></div><input class="field" dir="ltr" id="sample" value="${esc(cfg.sample)}" oninput="cfg.sample=this.value;sv('cfg',cfg)"></div>
  </div>
  <div class="sec">الكيبورد</div><div class="box">
   <div class="row" style="display:block"><div class="l">كيبورد استيكر فونت<div class="s">اكتب بالخطوط والتطويل مباشرة في أي تطبيق</div></div>
   <button class="act" onclick="kb(1)">1) تفعيل الكيبورد</button>
   <button class="act" onclick="kb(2)">2) اختيار الكيبورد</button>
   <input class="field" placeholder="جرّب الكيبورد هنا..."></div>
  </div>
  <div class="sec">البيانات</div>
  <button class="act red" onclick="favs=[];sv('favs',favs);toast('تم مسح المفضلة')">مسح المفضلة</button>
  <button class="act red" onclick="hist=[];sv('hist',hist);toast('تم مسح السجل')">مسح السجل</button>
  </div>`;
}
function devHtml(){
  const app=(k,e,bg,n,s)=>`<div class="row" onclick="go('${k}')"><div class="ic" style="background:${bg}">${e}</div><div class="l">${n}<div class="s">${s}</div></div><div class="go">Download</div></div>`;
  return `<div class="page"><div class="hero"><div class="avatar">MH</div><div class="nm">Mohamed Hassan Taha</div><div class="pill">DEVELOPER</div></div>
  <div class="sec">Contact</div><div class="box">
   <div class="row" onclick="go('gh')"><div class="ic" style="background:#24292f"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.700-.3-5.500-1.300-5.500-5.900 0-1.300.5-2.400 1.200-3.200-.1-.3-.5-1.500.1-3.200 0 0 1-.3 3.300 1.200a11.500 11.500 0 0 1 6 0c2.300-1.500 3.300-1.200 3.300-1.200.7 1.700.2 2.900.1 3.200.8.800 1.200 1.900 1.200 3.200 0 4.600-2.800 5.600-5.500 5.900.4.400.8 1.100.8 2.200v3.300c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg></div><div class="l">GitHub<div class="s">@oneshoot5010</div></div><div class="arrow">›</div></div>
   <div class="row" onclick="go('wa')"><div class="ic" style="background:#25d366">💬</div><div class="l">WhatsApp<div class="s" dir="ltr" style="text-align:left">+20 104 494 7639</div></div><div class="arrow">›</div></div>
  </div>
  <div class="sec">My Apps</div><div class="box">
   ${app('emoji','😀','linear-gradient(135deg,#ffd36a,#ff8a3d)','استيكرات ايموجي','Emoji Stickers')}
   ${app('rafiq','🤝','linear-gradient(135deg,#3d9bff,#6a3df0)','رفيق','Rafiq')}
   ${app('leo','🦁','linear-gradient(135deg,#ff8a3d,#d81f3a)','Leo Copilot Pro','AI Copilot')}
  </div>
  <div class="foot">استيكر فونت · v1.1<br>Developed by Mohamed Hassan Taha</div></div>`;
}
function kb(n){if(window.Android&&Android.keyboardSettings){n===1?Android.keyboardSettings():Android.keyboardPicker()}else toast('متاح داخل التطبيق فقط')}
function toast(m){if(window.Android&&Android.toast)Android.toast(m);else{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:14px;font-size:12px;z-index:9';document.body.appendChild(t);setTimeout(()=>t.remove(),1400)}}
function render(){
  const home=tab==='home';
  $('cats').innerHTML=CATS.map(c=>`<div class="cat ${c.id===cat?'on':''}" data-c="${c.id}">${siHtml(c.id)}${c.name}</div>`).join('');
  $('chips').innerHTML=CHIPS.map(c=>`<div class="chip ${c.c} ${c.id===chip?'on':''}" data-p="${c.id}">${CHIPICON[c.id]}${c.l}</div>`).join('');
  const full=tab==='set'||tab==='dev';
  $('top').style.display=full?'none':'block';
  $('chips').style.display=home?'flex':'none';
  document.querySelector('.side').style.display=home?'flex':'none';
  $('main').style.top=full?'8px':(home?'calc(var(--u)*101)':'calc(var(--u)*57)');
  $('nav').className=home?'home':'';
  $('cnt').textContent=[...$('q').value].length+' chars';
  const L=$('list');
  if(tab==='set'){L.innerHTML=settingsHtml();return}
  if(tab==='dev'){L.innerHTML=devHtml();return}
  let list=[];
  if(home)list=items();
  else if(tab==='favs')list=favs.map(t=>({cat:'Favorite',text:t}));
  else list=hist.map(t=>({cat:'History',text:t}));
  if(!list.length){L.innerHTML='<div class="empty">Nothing here yet</div>';return}
  L._list=list;
  L.innerHTML=list.map((x,i)=>`<div class="card ${favs.includes(x.text)?'fav':''}" data-i="${i}"><img src="ic/card${i%15}.png"><div class="txt"><div class="out">${esc(x.text)}</div><div class="meta">${x.cat} · ${[...x.text].length} chars</div></div><button class="btn" data-k="${i}">${COPYSVG}</button></div>`).join('');
}
function vib(n){if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}}
function copy(t){
  if(window.Android)Android.copy(t);else navigator.clipboard&&navigator.clipboard.writeText(t);
  vib(25);
  if(cfg.keep){hist=[t,...hist.filter(h=>h!==t)].slice(0,100);sv('hist',hist)}
}
$('q').addEventListener('input',render);
$('clr').onclick=()=>{$('q').value='';render()};
$('cats').onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();$('list').scrollTop=0}};
$('more').onclick=()=>{tab='set';syncNav();render()};
$('chips').onclick=e=>{const c=e.target.closest('[data-p]');if(c){chip=c.dataset.p;if(chip==='fonts')cat='fonts';else if(cat==='fonts')cat='all';render();$('list').scrollTop=0}};
function syncNav(){[...$('nav').children].forEach(n=>n.classList.toggle('on',n.dataset.t===tab))}
$('nav').onclick=e=>{const d=e.target.closest('[data-t]');if(!d)return;tab=d.dataset.t;syncNav();render();$('list').scrollTop=0};
let lp=null,lpFired=false;
$('list').addEventListener('touchstart',e=>{const c=e.target.closest('.card');lpFired=false;if(!c)return;lp=setTimeout(()=>{lpFired=true;const t=$('list')._list[+c.dataset.i].text;favs=favs.includes(t)?favs.filter(x=>x!==t):[t,...favs];sv('favs',favs);const y=$('list').scrollTop;render();$('list').scrollTop=y;vib(40)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('list').addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
$('list').onclick=e=>{if(lpFired){lpFired=false;return}const k=e.target.closest('[data-k]');if(k)copy($('list')._list[+k.dataset.k].text)};
applyCfg();render();
</script>

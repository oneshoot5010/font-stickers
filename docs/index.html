<script>

function wrapLines(g,tokens,maxW){const lines=[];let cur='';tokens.forEach(w=>{const test=cur?cur+' '+w:w;if(!cur||g.measureText(test).width<=maxW)cur=test;else{lines.push(cur);cur=w}});if(cur)lines.push(cur);return lines}
function layout(g,t,maxW,maxH){
  for(let s=150;s>=40;s-=6){g.font=s+'px '+CFONT;if(g.measureText(t).width<=maxW)return{s,lines:[t]}}
  const tokens=t.split(/\s+/).filter(Boolean);
  if(!tokens.length)return{s:60,lines:[t]};
  let best=null;
  for(let s=110;s>=24;s-=6){g.font=s+'px '+CFONT;const lines=wrapLines(g,tokens,maxW);best={s,lines};if(lines.length*s*1.35<=maxH&&lines.every(l=>g.measureText(l).width<=maxW))return best}
  g.font=best.s+'px '+CFONT;
  const w=Math.max(...best.lines.map(l=>g.measureText(l).width));
  return{s:Math.max(10,Math.floor(best.s*maxW/Math.max(w,1))),lines:best.lines};
}
function drawCard(c,t,o){
  const W=1080,H=o.h;c.width=W;c.height=H;
  const g=c.getContext('2d'),b=BGS[o.bg]||BGS[0];
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,b[0]);gr.addColorStop(1,b[1]);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle=b[2];g.textAlign='center';g.textBaseline='middle';
  try{g.direction=AR_RE.test(t)?'rtl':'ltr'}catch(e){}
  const L=layout(g,t,W-140,H-360),lh=L.s*1.35,total=lh*L.lines.length;
  g.font=L.s+'px '+CFONT;
  if(o.bg!==5){g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=18}
  const y0=(H-60)/2-total/2+lh/2;
  L.lines.forEach((ln,i)=>g.fillText(ln,W/2,y0+i*lh));
  g.shadowBlur=0;
  if(o.mark){g.globalAlpha=.6;g.font='34px '+CFONT;g.fillText('استيكر فونت',W/2,H-90);g.globalAlpha=1}
}
function openSheet(t){sh.t=t;$('sheet').style.display='flex';sheetRender()}
function closeSheet(){$('sheet').style.display='none'}
function sheetRender(){
  drawCard($('cv'),sh.t,sh);
  $('bgs').innerHTML=BGS.map((b,i)=>`<div class="dot ${i===sh.bg?'on':''}" style="background:linear-gradient(135deg,${b[0]},${b[1]})" onclick="sh.bg=${i};sheetRender()"></div>`).join('');
  $('szs').innerHTML=[[1080,'مربع'],[1920,'ستوري']].map(o=>`<span class="${o[0]===sh.h?'on':''}" onclick="sh.h=${o[0]};sheetRender()">${o[1]}</span>`).join('');
  $('mk').className='sw '+(sh.mark?'on':'');
}
function shareImg(){
  const c=$('cv');
  try{
    if(window.Android&&Android.shareImage)Android.shareImage(c.toDataURL('image/png').split(',')[1]);
    else c.toBlob(b=>{const f=new File([b],'style.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]});else toast('متاح داخل التطبيق فقط')});
  }catch(e){toast('تعذر إنشاء الصورة')}
}
function shareTxt(){if(window.Android&&Android.share)Android.share(sh.t);else if(navigator.share)navigator.share({text:sh.t});else toast('متاح داخل التطبيق فقط')}
function copySheet(){copy(sh.t);closeSheet()}
window.onAndroidBack=()=>{
  if($('rate').style.display==='flex'){$('rate').style.display='none';return true}
  if($('sheet').style.display==='flex'){closeSheet();return true}
  if($('welcome').style.display==='block'){closeWelcome();return true}
  if(tab!=='home'){tab='home';syncNav();render();return true}
  return false;
};
const REMOTE_URL='https://raw.githubusercontent.com/oneshoot5010/font-stickers/main/styles.json';
let rstat=ld('rstat',{ts:0}),rManual=false;
const okId=s=>typeof s==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(s);
const cl=(s,m)=>typeof s==='string'?s.slice(0,m):'';
function mergeRemote(j){
  if(!j||typeof j!=='object')return;
  if(Array.isArray(j.styles))j.styles.slice(0,60).forEach(s=>{
    if(!s||!okId(s.id)||!Array.isArray(s.items))return;
    const items=s.items.filter(x=>typeof x==='string'&&x.indexOf('[[t]]')>=0&&x.length<=200).slice(0,300);
    if(!items.length)return;
    const ex=STYLES.find(z=>z.id===s.id);
    if(ex){items.forEach(x=>{if(!ex.items.includes(x))ex.items.push(x)})}
    else STYLES.push({id:s.id,icon:cl(s.icon,4),name:esc(cl(s.name,24)||s.id),items});
  });
  if(Array.isArray(j.names))j.names.slice(0,200).forEach(n=>{
    if(!Array.isArray(n)||typeof n[0]!=='string'||typeof n[1]!=='string'||n[1].indexOf('{')<0||n[1].length>80)return;
    NAME_T.push([esc(cl(n[0],24)),n[1]]);
  });
}
function rebuildAll(){
  STYLES.splice(0,STYLES.length,...JSON.parse(JSON.stringify(BASE_STYLES)));
  NAME_T.splice(0,NAME_T.length,...BASE_NAMES.map(x=>x.slice()));
  const c=ld('remote',null);
  if(cfg.remote&&c){try{mergeRemote(c)}catch(e){}}
  ld('mystyles',[]).forEach(s=>{if(s&&okId(s.id)&&Array.isArray(s.items)){const its=s.items.filter(x=>typeof x==='string'&&x.indexOf('[[t]]')>=0&&x.length<=200).slice(0,30);if(its.length)STYLES.push({id:s.id,icon:'✏️',name:cl(s.name,24)||s.id,items:its})}});
  buildCats();
  if(!CATS.some(x=>x.id===cat))cat='all';
}
function refreshRemote(force){
  if(!cfg.remote&&!force)return;
  if(!force&&Date.now()-rstat.ts<6*3600*1000)return;
  rManual=!!force;
  if(window.Android&&Android.fetchRemote)Android.fetchRemote();
  else fetch(REMOTE_URL,{cache:'no-store'}).then(r=>r.text()).then(window.onRemote).catch(()=>window.onRemote(''));
}
window.onRemote=function(txt){
  const man=rManual;rManual=false;
  if(!txt){if(man)toast('تعذر التحديث، تأكد من الإنترنت');return}
  try{
    const j=JSON.parse(txt);
    if(!j||typeof j!=='object'||Array.isArray(j))throw 0;
    let same=false;try{same=localStorage.getItem('remote')===JSON.stringify(j)}catch(e){}
    rstat={ts:Date.now()};sv('rstat',rstat);
    if(!same){sv('remote',j);rebuildAll()}
    if(!same||man||tab==='set')render();
    if(man)toast('تم تحديث الستايلات ✓');
  }catch(e){if(man)toast('ملف التحديث غير صالح')}
};
function manualRemote(){refreshRemote(true)}
// ---- app self-update: reads latest.json from the newest GitHub release ----
let upd=null,updManual=false,updReady=false;
function updCheck(manual){
  if(!(window.Android&&Android.updateCheck)){if(manual)toast('متاح داخل التطبيق فقط');return}
  updManual=manual;Android.updateCheck();
}
window.onUpdate=function(txt){
  let j=null;try{j=JSON.parse(txt)}catch(e){}
  if(!j||!j.versionCode){if(updManual)toast('تعذر فحص التحديث، اتأكد من الإنترنت');return}
  sv('updLast',Date.now());
  const cur=window.Android&&Android.appVersion?Android.appVersion():0;
  if(j.versionCode>cur){upd=j;updReady=false;updDialog()}
  else if(updManual)toast('أنت على أحدث نسخة ✓');
};
function updDialog(){
  const old=document.getElementById('updDlg');if(old)old.remove();
  const d=document.createElement('div');d.id='updDlg';
  d.style.cssText='position:fixed;inset:0;z-index:9999;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML='<div dir="rtl" style="width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;color:var(--txt)">'
   +'<div style="font-size:18px;font-weight:700;margin-bottom:6px">فيه تحديث جديد 🎉</div>'
   +'<div id="updVer" style="font-size:12px;color:var(--muted);margin-bottom:10px"></div>'
   +'<div id="updNotes" style="font-size:13px;line-height:1.7;white-space:pre-line;max-height:160px;overflow:auto;margin-bottom:14px;-webkit-user-select:text;user-select:text"></div>'
   +'<div id="updBar" style="display:none;height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:12px"><div id="updFill" style="height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2))"></div></div>'
   +'<div style="display:flex;gap:10px"><button id="updGo" onclick="updGo()" style="flex:1;height:44px;border:0;border-radius:14px;color:#fff;font-size:15px;background:linear-gradient(90deg,var(--a1),var(--a2))">حدّث</button>'
   +'<button id="updLater" onclick="updLater()" style="flex:0 0 90px;height:44px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:14px">بعدين</button></div></div>';
  document.body.appendChild(d);
  document.getElementById('updVer').textContent='النسخة '+(upd.versionName||upd.versionCode);
  document.getElementById('updNotes').textContent=upd.notes||'تحسينات وإصلاحات';
}
function updGo(){
  if(!upd)return;
  if(updReady){Android.updateInstall();return}
  document.getElementById('updBar').style.display='block';
  document.getElementById('updGo').textContent='بيتحمل… 0%';
  Android.updateDownload(upd.url);
}
function updLater(){const d=document.getElementById('updDlg');if(d)d.remove()}
window.onUpdProg=function(p){
  const g=document.getElementById('updGo'),f=document.getElementById('updFill');if(!g)return;
  if(p>=0&&p<=100){f.style.width=p+'%';g.textContent='بيتحمل… '+p+'%'}
  else if(p===101){updLater()}
  else if(p===-4){updReady=true;g.textContent='تثبيت';toast('اسمح بالتثبيت من الشاشة اللي فتحت، وارجع اضغط تثبيت')}
  else if(p===-2){g.textContent='حدّث';document.getElementById('updBar').style.display='none';toast('فشل التحميل من التطبيق، فتحت لك صفحة التحميل')}
};
function toggleRemote(){cfg.remote=!cfg.remote;sv('cfg',cfg);rebuildAll();if(cfg.remote)refreshRemote(false);render()}
function kb(n){if(window.Android&&Android.keyboardSettings){n===1?Android.keyboardSettings():Android.keyboardPicker()}else toast('متاح داخل التطبيق فقط')}
function toast(m){if(window.Android&&Android.toast)Android.toast(m);else{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:14px;font-size:12px;z-index:9';document.body.appendChild(t);setTimeout(()=>t.remove(),1400)}}
function render(){
  const home=tab==='home';
  $('cats').innerHTML=CATS.map(c=>`<div class="cat ${c.id===cat?'on':''}" data-c="${c.id}">${siHtml(c.id)}${c.name}</div>`).join('');requestAnimationFrame(wheel);
  const chSl=$('chips').scrollLeft;$('chips').innerHTML=CHIPS.map(c=>`<div class="chip ${c.c} ${c.id===chip?'on':''}" data-p="${c.id}">${CHIPICON[c.id]}${c.l}</div>`).join('');$('chips').scrollLeft=chSl;
  const full=tab==='set'||tab==='dev'||tab==='bio';
  $('top').style.display=full?'none':'block';
  $('chips').style.display=home?'flex':'none';
  document.querySelector('.side').style.display=home?'flex':'none';
  $('main').style.top=full?'8px':(home?'calc(var(--u)*101)':'calc(var(--u)*57)');
  $('nav').className=home?'home':'';
  $('cnt').textContent=[...$('q').value].length+' chars';
  const L=$('list');
  L._list=null; // stop the home list from appending cards into settings/developer/bio pages
  if(tab==='set'){L.innerHTML=settingsHtml();return}
  if(tab==='dev'){L.innerHTML=devHtml();return}
  if(tab==='bio'){L.innerHTML=bioHtml();bioUpdate();return}
  renderList();
}
const PAGE=40;
let rt=null;
function cardHtml(x,i){return `<div class="card ${favs.includes(x.text)?'fav':''} ext" data-i="${i}"><img src="ic/card${i%15}.png" decoding="async"><div class="txt"><div class="out">${esc(x.text)}</div><div class="meta">${x.cat} · ${[...x.text].length} chars</div></div><button class="btn" data-k="${i}">${COPYSVG}</button></div>`}
function appendCards(L){const a=L._n||0,b=Math.min(a+PAGE,L._list.length);if(a>=b)return;let s='';for(let i=a;i<b;i++)s+=cardHtml(L._list[i],i);L.insertAdjacentHTML('beforeend',s);L._n=b}
function renderList(){
  const L=$('list');
  let list=[];
  if(tab==='home')list=items();
  else if(tab==='favs')list=favs.map(t=>({cat:'Favorite',text:t}));
  else if(tab==='hist')list=hist.map(t=>({cat:'History',text:t}));
  else return;
  L._list=list;L._n=0;
  if(!list.length){L.innerHTML='<div class="empty">Nothing here yet</div>';return}
  L.innerHTML='';appendCards(L);
}
let rate=ld('rate',{next:15,done:false});
function vib(n){if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}}
function copy(t){
  if(window.Android)Android.copy(t);else navigator.clipboard&&navigator.clipboard.writeText(t);
  vib(25);
  const cn=ld('copies',0)+1;sv('copies',cn);
  if(!rate.done&&cn>=rate.next)setTimeout(()=>{$('rate').style.display='flex'},600);
  if(cfg.keep){hist=[t,...hist.filter(h=>h!==t)].slice(0,100);sv('hist',hist)}
}
$('q').addEventListener('input',()=>{$('cnt').textContent=[...$('q').value].length+' chars';clearTimeout(rt);rt=setTimeout(renderList,140)});
$('list').addEventListener('scroll',()=>{const L=$('list');if(L._list&&(L._n||0)<L._list.length&&L.scrollTop+L.clientHeight>=L.scrollHeight-400)appendCards(L)},{passive:true});
$('clr').onclick=()=>{$('q').value='';render()};
$('cats').onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;if(CHIPN[chip])chip='all';render();$('list').scrollTop=0}};
$('more').onclick=()=>{tab='set';syncNav();render()};
$('chips').onclick=e=>{const c=e.target.closest('[data-p]');if(c){chip=c.dataset.p;if(chip==='fonts')cat='fonts';else if(cat==='fonts'||CHIPN[chip])cat='all';render();$('list').scrollTop=0}};
function syncNav(){[...$('nav').children].forEach(n=>n.classList.toggle('on',n.dataset.t===tab))}
$('nav').onclick=e=>{const d=e.target.closest('[data-t]');if(!d)return;tab=d.dataset.t;syncNav();render();$('list').scrollTop=0};
/* 3D carousel for the category rail: items curve away from the centre while scrolling */
function wheel(){const W=$('cats');if(!W)return;const r=W.getBoundingClientRect();if(!r.height)return;const mid=r.top+r.height/2;W.querySelectorAll('.cat').forEach(c=>{const b=c.getBoundingClientRect();const d=Math.max(-1,Math.min(1,(b.top+b.height/2-mid)/(r.height/2)));c.style.transform=`rotateX(${(-d*50).toFixed(1)}deg) scale(${(1-Math.abs(d)*0.18).toFixed(3)})`;c.style.opacity=(1-Math.abs(d)*0.55).toFixed(2)})}
$('cats').addEventListener('scroll',()=>requestAnimationFrame(wheel),{passive:true});
/* card tilt under the finger */
const tiltOff=()=>document.querySelectorAll('.card').forEach(c=>{c.style.removeProperty('--rx');c.style.removeProperty('--ry')});
$('list').addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&e.pointerType!=='mouse')return;const c=e.target.closest('.card');if(!c)return;const b=c.getBoundingClientRect();const x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.setProperty('--ry',(x*28).toFixed(2)+'deg');c.style.setProperty('--rx',(-y*24).toFixed(2)+'deg')},{passive:true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('list').addEventListener(ev,tiltOff,{passive:true}));
/* gyroscope: tilting the phone moves the cards */
let gx=0,gy=0,gp=false;
const onOrient=e=>{if(e.gamma==null||gp)return;gp=true;requestAnimationFrame(()=>{gp=false;const tx=Math.max(-22,Math.min(22,e.gamma)),ty=Math.max(-22,Math.min(22,e.beta-45));gx+=(tx-gx)*0.35;gy+=(ty-gy)*0.35;const R=document.documentElement.style;R.setProperty('--gx',gx.toFixed(2)+'deg');R.setProperty('--gy',gy.toFixed(2)+'deg')})};
/* iPhone (iOS) needs permission for motion, asked once on the first tap; Android just listens */
if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
  const askMotion=()=>{document.removeEventListener('click',askMotion);DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')window.addEventListener('deviceorientation',onOrient,{passive:true})}).catch(()=>{})};
  document.addEventListener('click',askMotion);
}else window.addEventListener('deviceorientation',onOrient,{passive:true});
let lp=null,lpFired=false;
$('list').addEventListener('touchstart',e=>{const c=e.target.closest('.card');lpFired=false;if(!c)return;lp=setTimeout(()=>{lpFired=true;const t=$('list')._list[+c.dataset.i].text;favs=favs.includes(t)?favs.filter(x=>x!==t):[t,...favs];sv('favs',favs);const Lx=$('list'),y=Lx.scrollTop,n=Lx._n||0;render();while((Lx._n||0)<n&&Lx._n<Lx._list.length)appendCards(Lx);Lx.scrollTop=y;vib(40)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('list').addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
$('list').onclick=e=>{if(lpFired){lpFired=false;return}const k=e.target.closest('[data-k]');if(k){copy($('list')._list[+k.dataset.k].text);return}const c=e.target.closest('.card');if(c&&$('list')._list)openSheet($('list')._list[+c.dataset.i].text)};
$('rateYes').onclick=()=>{rate.done=true;sv('rate',rate);$('rate').style.display='none';openUrl(SHARE_URL)};
$('rateLater').onclick=()=>{rate.next=ld('copies',0)+25;sv('rate',rate);$('rate').style.display='none'};
$('rateNo').onclick=()=>{rate.done=true;sv('rate',rate);$('rate').style.display='none'};
rebuildAll();applyCfg();render();
if(!ld('seen',false)||!ld('guide2',false))showWelcome();
setTimeout(()=>refreshRemote(false),1200);
setTimeout(()=>updCheck(false),3500);
if(!ld('tip184',false)){sv('tip184',true);if(ld('seen',false))setTimeout(()=>toast('جديد: ستايلاتك الخاصة ومولّد البايو ✍️ من الإعدادات'),1500)}
</script>

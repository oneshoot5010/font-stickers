name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare keystore
        env:
          KS: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.jks"; fi
      - run: gradle assembleDebug --no-daemon
        env:
          KS_FILE: ${{ runner.temp }}/ks.jks
          KS_PASS: ${{ secrets.KS_PASS }}
      - name: Write latest.json (read by the app to offer updates)
        run: |
          python3 - <<'PY'
          import json, re, os
          g = open('app/build.gradle', encoding='utf-8').read()
          vc = int(re.search(r'versionCode\s+(\d+)', g).group(1))
          vn = re.search(r"versionName\s+'([^']+)'", g).group(1)
          notes = ''
          if os.path.exists('update-notes.txt'):
              notes = open('update-notes.txt', encoding='utf-8').read().strip()
          run = os.environ['RUN_NUMBER']
          repo = os.environ['REPO']
          json.dump({'versionCode': vc, 'versionName': vn, 'notes': notes,
                     'url': f'https://github.com/{repo}/releases/download/build-{run}/app-debug.apk'},
                    open('latest.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            latest.json
